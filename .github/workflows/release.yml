name: Build and Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=${TAG} pyproject=${PY_VERSION}"
          test "${TAG}" = "${PY_VERSION}"

      - name: Build wheel
        run: python -m build -w

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Generate latest-only versions.json
        run: |
          set -euo pipefail
          WHL="$(ls dist/*.whl | head -n1)"
          ARTIFACT="$(basename "${WHL}")"
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/generate_versions_json.py \
            --version "${VERSION}" \
            --version-path "${GITHUB_REF_NAME}" \
            --commit "$(git rev-parse --short HEAD)" \
            --artifact "${ARTIFACT}" \
            --output dist/versions.json

      - name: Upload artifacts to MinIO
        run: |
          chmod +x scripts/upload_minio.sh
          ./scripts/upload_minio.sh dist
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          WH_BUILD_TAG: ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
