[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wormhole-auto-config"
version = "1.0.4"
description = "Local operator tool for Wormhole device WiFi / MQTT auto-configuration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "psutil>=6.0.0",
  "pydantic>=2.0.0",
  "packaging>=24.0",
]

[project.scripts]
wormhole-auto-config = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]
